[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "vertebra-segmentation"
version = "0.1.0"
description = "CT-based vertebral segmentation and anatomical labeling with surgical navigation analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vertebra Segmentation Team", email = "research@example.com"}
]
keywords = ["medical-imaging", "segmentation", "vertebra", "spine", "CT", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical/Dental Information Systems",
]

dependencies = [
    "torch>=2.0.0",
    "monai>=1.2.0",
    "nibabel>=5.0.0",
    "pydicom>=2.4.0",
    "SimpleITK>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.2.0",
    "isort>=5.12.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.22.0",
    "ipywidgets>=8.0.0",
]
all = [
    "vertebra-segmentation[dev,jupyter]",
]

[project.urls]
Repository = "https://github.com/MoorthyDurga/Perfint_Research"
Documentation = "https://github.com/MoorthyDurga/Perfint_Research"
Issues = "https://github.com/MoorthyDurga/Perfint_Research/issues"

[tool.setuptools]
packages = ["project1_vertebra_segmentation"]

[tool.setuptools.package-data]
project1_vertebra_segmentation = [
    "configs/*.yaml",
    "py.typed",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310"]
include = '\.pyi$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
  | results
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["project1_vertebra_segmentation/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
